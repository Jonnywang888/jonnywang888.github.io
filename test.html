<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>高效 EAN-13 条码扫描</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#111; color:#fff; }
    #video { width:100%; height:auto; background:#000; }
    #overlay { position:absolute; border:2px dashed rgba(0,255,0,.5); width:60%; height:40%; 
               left:20%; top:30%; pointer-events:none; }
    #result { padding:10px; background:#222; text-align:center; font-size:1.2em; }
  </style>
</head>
<body>
  <div style="position:relative">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
  </div>
  <div id="result">等待扫描...</div>

  <canvas id="capture" style="display:none"></canvas>
  <canvas id="rotated" style="display:none"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm/dist/iife/reader/index.js"></script>
  <script>
    (async () => {
      const video = document.getElementById("video");
      const capture = document.getElementById("capture");
      const rotated = document.getElementById("rotated");
      const resultBox = document.getElementById("result");

      let lastText = "";
      let lastTime = 0;
      let scanning = false;

      const options = {
        tryHarder: true,
        formats: ["EAN_13"],   // 只识别 EAN-13
      };

      async function startCamera() {
        const constraints = {
          video: { facingMode: { ideal: "environment" }, width:{ideal:1280}, height:{ideal:720} }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = res);
      }

      function getImageData() {
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (!w || !h) return null;

        // 裁剪中央区域
        const cropW = Math.round(w * 0.6);
        const cropH = Math.round(h * 0.4);
        const sx = (w - cropW) / 2;
        const sy = (h - cropH) / 2;

        // 缩小到一半尺寸，加快解码
        capture.width = cropW / 2;
        capture.height = cropH / 2;
        const ctx = capture.getContext("2d");
        ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, capture.width, capture.height);
        return ctx.getImageData(0, 0, capture.width, capture.height);
      }

      function rotateImageData(imageData) {
        const w = imageData.width, h = imageData.height;
        rotated.width = h; rotated.height = w;
        const ctx = rotated.getContext("2d");
        const tmp = document.createElement("canvas");
        tmp.width = w; tmp.height = h;
        tmp.getContext("2d").putImageData(imageData,0,0);
        ctx.save();
        ctx.translate(h/2, w/2);
        ctx.rotate(Math.PI/2);
        ctx.drawImage(tmp,-w/2,-h/2);
        ctx.restore();
        return ctx.getImageData(0,0,h,w);
      }

      async function scanLoop() {
        if (!scanning) return;
        const img = getImageData();
        if (img) {
          let results = await ZXingWASM.readBarcodesFromImageData(img, options);

          if ((!results || results.length===0)) {
            const rotatedImg = rotateImageData(img);
            results = await ZXingWASM.readBarcodesFromImageData(rotatedImg, options);
          }

          if (results && results.length > 0) {
            const text = results[0].text;
            const now = Date.now();
            // 去抖动：1秒内重复结果不触发
            if (text !== lastText || now - lastTime > 1000) {
              lastText = text;
              lastTime = now;
              resultBox.textContent = "识别结果: " + text;
              console.log("条码格式:", results[0].format, " 内容:", text);
            }
          }
        }
        setTimeout(scanLoop, 150); // ~6FPS
      }

      await startCamera();
      scanning = true;
      scanLoop();
    })();
  </script>
</body>
</html>
