<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var base = '/readest/';
        if (path.indexOf(base) === 0) {
          var clean = path.replace(/\/+$/, '');
          if (!/\.[a-z0-9]{1,8}$/i.test(clean)) {
            window.location.replace(clean + '.html' + window.location.search + window.location.hash);
            return;
          }
        }
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML =
            '<main style="font:16px/1.5 system-ui;max-width:32rem;margin:18vh auto;padding:0 1.5rem">' +
            '<h1 style="font-size:1.4rem">Page not found</h1>' +
            '<p><a href="/">Go to the home page</a></p></main>';
        });
      })();
    </script>
  </head>
  <body></body>
</html>
