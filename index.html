<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 禁用双击缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记账App</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/app.png">
    <!-- <meta name="theme-color" content="#f7f7f7"/> -->
    <meta name="theme-color" content="'#49c2ef">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page" id="mainpage">
        <div class="head">
            <div class="head-title">
                <div class="head-data">
                    <span id="head-mese"></span>/
                    <span id="head-anno"></span>
                </div>
            </div>
            <div class="head-infotot">
                <div class="head-tot-in">
                    <div class="text">收入：</div>
                    <div id="head-tot-in"></div>
                </div>
                <div class="head-tot-out">
                    <div class="text">:支出</div>
                    <div id="head-tot"></div>
                </div>
            </div>
        </div>
        <div id="maincontainer">
            <div id="refresh-container">
                <img id="refresh" src="icons/load.gif" alt="刷新中...">
                <div id="refresh-text">下拉刷新</div>
            </div>
            <ul class="main" id="listmovimento"></ul>
            <div id="load-container">
                <img id="load" src="icons/load.gif" alt="加载中...">
            </div>
        </div>
        <div id="memori-container">
            <div class="memori-head">
                <div class="memori-title">提醒事项</div>
                <div class="close">X</div>
            </div>
            <div class="memori-box"></div>
        </div>
    </div>
    <div class="page" id="addpage">
        <div class="addhead">
            <div class="addhead-title">
                <div class="backup" id="backtomain">
                    <img src="icons/back-nero.png" alt="">
                    <span>返回</span>
                </div>
                <div class="text addhead-out dixian">支出</div>
                <div class="text addhead-in">收入</div>
            </div>
            <div class="current-selection">
                <div class="current-img">
                    <img id="current-img" src="icons/chaoshi.png" alt="超市">
                </div>
                <div id="current-motivo">超市</div>
                <div class="current-value">
                    <span class="current-sign">-</span>
                    <span id="current-value">0.00</span>
                </div>
            </div>
        </div>
        <div id="tabmotivi">
            <div class="motivi-item">
                <img src="icons/chaoshi.png" alt="超市">
                <span>超市</span>
            </div>
        </div>
        <div id="tastiera">
            <div class="nota">
                <div>备注：</div>
                <div>
                    <input type="text" id="tas-nota" placeholder="请输入备注">
                </div>
            </div>
            <div class="tas-info">
                <span id="tas-data">8月19日</span>
                <button id="tas-butnota">备注</button>
            </div>
            <div class="keys">
                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key" style="color:red">&#9003;</button>
                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>
                <button class="key conferma" id="conferma">确定</button> 
                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key" style="color:red">C</button>
                <button class="key">0</button>
                <button class="key">.</button>
            </div>
        </div>
        <div id="calendar">
            <div class="calendar-header">
                <div class="year-controls">
                    <button class="prev-year">&lt;</button>
                    <span class="year-display">2024年</span>
                    <button class="next-year">&gt;</button>
                </div>
                <div class="month-controls">
                    <button class="prev-month">&lt;</button>
                    <span class="month-display">8月</span>
                    <button class="next-month">&gt;</button>
                </div>
            </div>
            <div class="calendar-body">
                <div class="calendar-weekdays">
                    <span>日</span>
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                </div>
                <div class="calendar-days">
                    <!-- 日历天数将由JS动态生成 -->
                </div>
            </div>
            <div>
                <button class="calendar-ok">确认</button>
            </div>
        </div>
    </div>
    <div class="page center" id="logpage">
        <div class="head-title">记账簿</div>
        <div class="head-title">记录生活每一天</div>
        <div class="avatar main">
            <img class="famiglia" src="icons/famiglia.jpg" alt="">
        </div>
        <form id="login-form">
            <input class="loginput" id="username" type="text" placeholder="Username" required>
            <input class="loginput" id="password" type="password" placeholder="Password" required>
            <input type="submit" value="登录">
        </form>
    </div>
    <div class="page" id="setpage">
        <div class="head">
            <div class="head-title">记账簿</div>
            <div class="head-title">设置界面</div>
        </div>
        <div class="set-page main center" id="sp-main">
            <div class="avatar main">
                <img class="famiglia logo-utente" src="icons/famiglia.jpg" alt="">
            </div>
            <div class="set-utente"></div>
            <div>
                <div class="set-unload"></div>
            </div>
            <br>
            <button class="but-mensile" id="mensile">配置提醒</button>
            <div class="item-flex set-buts">
                <button class="set-but" id="reload">重新加载</button>
                <button class="set-but" id="logout">退出登录</button>
            </div>
        </div>
        <div class="set-page set-memori" id="sp-memori">
            <div class="set-memori-content"></div>
            <button id="modifimemori">编辑事项</button>   
            <div class="item-flex set-buts">
                <button class="set-but" id="addmemori">添加事项</button>
                <button class="set-but" id="set-back">返回</button>
            </div>           
        </div>
        <div class="set-page set-memori-motivi" id="sp-add">
            <div id="settabmotivi"></div>
        </div>
    </div>
    <div class="page" id="biaopage">
        <div class="head">
            <div class="biao-tongji">
                <div class="dixian biao-month" page='biao-month'>月统计</div>
                <div class="biao-year" page='biao-year'>年统计</div>
                <div class="biao-diy" page='biao-diy'>自定义</div>
            </div>
            <div class="biao-head-display">
                <div class="biao-page" id="biao-month">
                    <select class="biao-head-year" id="biao-head-year"></select>
                    <div class="biao-head-month"></div>
                </div>
                <div class="biao-page" id="biao-year"></div>
                <div class="biao-page" id="biao-diy">
                    <div>
                        <select class="biao-diy-year" id="biao-diy-year-dal"></select>
                        <select class="biao-diy-month" id="biao-diy-month-dal"></select>
                    </div>
                    <div>---</div>
                    <div>
                        <select class="biao-diy-year" id="biao-diy-year-al"></select>
                        <select class="biao-diy-month" id="biao-diy-month-al"></select>
                    </div>
                </div>
            </div>
        </div>
        <div class="main">
            <div class="biao-tot">
                <div>总计：</div>
                <div class="biao-tot-in"></div>
                <div class="biao-tot-out"></div>
            </div>
            <div id="biao-lie"></div>
            <div id="biao-di"></div>
            <div id="biao-display"></div>
            <div id="biao-hang"></div>
        </div>
    </div>
    <div class="page" id="infopage">
        <div class="info-head">
            <div class="info-title">
                <div class="backup" id="backtobiao">
                    <img src="icons/back-bianco.png" alt=""><span>返回</span>
                </div>
                <div class="info-motivo">其他</div>
            </div>
            <div class="info-tot">
                <div>总支出：</div>
                <div class="info-tot-spesa"></div>
            </div>
        </div>
        <div>
            <ul id="info-list"></ul>
        </div>
    </div>
    <div class="foot">
        <div class="foot-item" id="but-baobiao">
            <img src="icons/baobiao.png" alt="报表">
            <div>报表</div>
        </div>
        <div class="foot-item" id="but-tianjia">
            <img src="icons/tianjia.png" alt="添加">
            <div>主页</div>
        </div>
        <div class="foot-item" id="but-renwu">
            <img src="icons/renwu.png" alt="人物">
            <div>设置</div>
        </div>
    </div>
    <script src="fun.js?v=1.0"></script>
    <script src="script.js?v=1.3"></script>
</body>
</html>
